spring.application.name=demo
server.port=9091
management.endpoints.web.exposure.include=health, cache
#management.endpoints.web.exposure.exclude=*
management.endpoint.health.show-details=always
info.app.name=Demo Spring Application
info.app.version=1.0.0
management.info.env.enabled=true
# 1. Database Connection Details (PostgreSQL Example)
spring.datasource.url=jdbc:postgresql://localhost:32768/postgres
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Hibernate/JPA Configuration
# DDL Auto: Controls schema generation (create, update, validate, none)
spring.jpa.hibernate.ddl-auto=update
# Show SQL: Logs the SQL generated by Hibernate to the console
spring.jpa.show-sql=true
# Dialect: Usually auto-detected, but can be specified
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 3. Define where to find your Entity classes (optional, usually auto-detected)
spring.jpa.properties.hibernate.packagesToScan=com.example.demo.model

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=testdb

